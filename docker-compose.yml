
services:
  url-shortener-db:
    image: postgres:16 
    restart: unless-stopped 
    ports:
      - "5433:5432"
    volumes:
      - "url-shortener-volume:/var/lib/postgresql/data"
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER} 
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$DB_USER -d $$DB_NAME"]
      start_period: 10s 
      timeout: 5s 
      interval: 5s 
      retries: 3


volumes:
  url-shortener-volume: